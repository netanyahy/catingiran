# ==============================================================================
#                    catingiran (cti) - Configuration Preset
#         Location: ~/.config/catingiran/catingiran.conf
# ==============================================================================

# Color theme preset:
#   charcoal   - Graphite dark UI + crisp IDE syntax colors (default)
#   obsidian   - Pitch black + Gentoo violet accent
#   catppuccin - Catppuccin Mocha
#   tokyonight - Tokyo Night
#   nord       - Arctic Nord
#   light      - Clean light theme
theme = charcoal

# Editor indentation & display
tab_size = 4
expand_tab = true
line_numbers = true
cursorline = true
auto_indent = true
auto_pairs = true
auto_complete = true
auto_lint = true

# Top bufferline tabs (1 file1  2 file2*)
show_tabs = true

# Mouse support (click tabs, sidebar, editor, wheel scroll)
mouse = true

# VS Code-like File Explorer Sidebar
sidebar_open = true
sidebar_width = 28
show_hidden = true
nerd_icons = true

# Bottom Output Drawer height (lines)
output_height = 8

# Show Git branch in statusline
git_branch = true

# Support Russian keyboard layout in Normal/Command mode (ж -> :, р/о/л/д -> h/j/k/l)
russian_keymap = true

# ==============================================================================
#                    Built-in Plugin Manager (catingiran Plug)
#   Built-in IDE packs:  plugin = python   |   plugin = c   |   plugin = java
#   GitHub plugins:      plugin = user/repo
#   Commands inside cti: :PlugList, :PlugAdd <name>, :PlugCreate <name>
# ==============================================================================
plugin = python
plugin = c
plugin = java
