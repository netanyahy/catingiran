# ==============================================================================
#                    catingiran (cti) - Configuration Preset
#         Location: ~/.config/catingiran/catingiran.conf
#         Edit inside cti with :conf  |  Reload live with :reload
# ==============================================================================

# --- 1. Appearance & Themes ---
# Themes: charcoal, obsidian, catppuccin, tokyonight, nord, light
theme = charcoal
show_tabs = true
statusline = true
line_numbers = true
relative_numbers = false
cursorline = true
colorcolumn = 100
nerd_icons = true

# --- 2. Indentation & Editing ---
tab_size = 4
expand_tab = true
auto_indent = true
auto_pairs = true
highlight_current_word = true
trailing_whitespace = true
trim_on_save = false

# --- 3. Scrolling & Input ---
scrolloff = 0
mouse = true
russian_keymap = false

# --- 4. Search & Highlighting ---
ignore_case = true
smart_case = true
hl_search = true

# --- 5. History, Undo & Behavior ---
undo_levels = 500
persistent_undo = false
confirm_quit = true

# --- 6. VS Code-Style Explorer & Output Drawer ---
sidebar_open = true
sidebar_width = 28
# sidebar_side: left | right
sidebar_side = left
show_hidden = false
output_height = 8

# --- 7. IDE, LSP & Autocomplete ---
auto_complete = true
autocomplete_min_chars = 2
auto_lint = false
lsp_enabled = true
lsp_auto_hover = false
git_branch = true

# --- 8. Built-in Plugin Manager (catingiran Plug) ---
# Built-in packs: python, c, java, web, git-extras
# GitHub plugins: user/repo
plugin = python
plugin = c
plugin = java
